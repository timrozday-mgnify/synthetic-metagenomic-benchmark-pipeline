# Panel reinterpretation through `sr_settings:` (stub-only).
#
# `database: generic` stands in for the generic database (SILVA SSU) the reads are mapped
# against; its `taxonomy:` lineages give it a .tax sidecar, which every run of the row
# takes as --taxonomy. `panel: panelA` reinterprets those labels through the panelA collection. No row profiles
# against panelA directly; it is built because a setting names it. Every entry is its own
# reference set (`whole_db` is the whole-database panel), so this is 5 kernel builds and 5
# inference runs, each handed its build's kernel. panelTaxa is a pre-built taxa-only dir (no FASTA) and panelMixed a built
# collection mixing a genome with a taxon; taxon
# entries resolve against generic's taxonomy, and are species (the only rank tested). `sr_error_model` reaches the nested samplesheet for the trained kernel.
databases:
  generic:
    sequences:
      - {id: genomeA, ssu: tests/data/ssuA.fasta,
         taxonomy: "Bacteria;Bacillota;Bacilli;Bacillales;Bacillaceae;Bacillus;Bacillus subtilis"}
      - {id: genomeB, ssu: tests/data/ssuB.fasta,
         taxonomy: "Bacteria;Bacteroidota;Bacteroidia;Bacteroidales;Bacteroidaceae;Bacteroides;Bacteroides fragilis"}
  panelA:
    sequences:
      - {id: genomeA, ssu: tests/data/ssuA.fasta}
      - {id: genomeB, ssu: tests/data/ssuB.fasta}
  panelTaxa:
    path: tests/data/prebuilt_db/panelTaxa   # panelTaxa_ssu.panel_taxa.tsv only
  panelMixed:
    sequences:
      - {id: genomeA,              ssu: tests/data/ssuA.fasta}
      - {id: bacteroides_fragilis, taxon: "Bacteria;Bacteroidota;Bacteroidia;Bacteroidales;Bacteroidaceae;Bacteroides;Bacteroides fragilis"}

samples:
  - sample: S2
    train_id: natA
    train_fastq_1: tests/data/natural_R1.fastq.gz
    train_fastq_2: tests/data/natural_R2.fastq.gz
    platform: hq-illumina
    genomes_csv: tests/data/genomes_S2_ssu.csv
    num_reads: 2000
    mode: amplicon
    read_length_mean: 200
    profilers: [sr_amplicon]
    database: generic
    sr_error_model: tests/data/pretrained_natA/natA.model.pt
    sr_settings:
      - {name: whole_db, mismapping_method: align, align_tau: 0}
      - {name: panel_trained, mismapping_method: simulate, matrix_args: --sim_error_model trained,
         panel: panelA, infer_presence: false}
      - {name: panel_flat, mismapping_method: simulate, panel: panelA, infer_presence: false}
      - {name: panel_taxa, mismapping_method: simulate, panel: panelTaxa, infer_presence: false}
      - {name: panel_mixed, mismapping_method: simulate, panel: panelMixed, infer_presence: false}
