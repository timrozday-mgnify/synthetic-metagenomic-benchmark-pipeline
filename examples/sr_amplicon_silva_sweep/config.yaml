# Config for the SILVA superresolution-amplicon parameter sweep. This one file is the
# single source of truth for both generator scripts - no paths or metadata are
# hard-coded in Python. Relative paths resolve against this file's dir.
#
# It is the negative-binomial community of examples/abundance_nb_sample profiled with
# the parameter grid of examples/sr_amplicon_param_sweep, against a PRE-BUILT reference
# set (`database.path:`), SILVA SSU Ref NR99. The shipped paths are dummies: fill in
# the two train FASTQs, the panel's `ssu:` paths and `database.path:`, then `./run.sh`.

train:
  id: sc2200627
  # Real reads the sequencing-error model is trained from (once, shared by all samples).
  fastq_1: /PATH/TO/SC2200627_R1.fastq.gz
  fastq_2: /PATH/TO/SC2200627_R2.fastq.gz
  platform: hq-illumina        # 2x300 MiSeq amplicon tails may fit 'lq-illumina' better

reads:
  num_reads: 1000000           # 500k pairs x 2 (pipeline counts paired reads as pairs*2)
  subsample: [none, 100000]    # one benchmark dir per depth; `none` = full depth
  paired_end: true
  read_length_mean: 300
  read_length_variance: 0

# Community model, identical to examples/abundance_nb_sample: each panel genome is drawn
# INDEPENDENTLY per sample - Bernoulli(presence) decides whether it is there at all, and
# if so NegBinom(mean, dispersion) sets its abundance. Seeded, so a rerun reproduces the
# same 20 communities. A genome may override `presence:` and/or `nb: {mean?, dispersion?}`
# inline in `panel`.
#
# Why this community and not the sub-species sweep of examples/sr_amplicon_param_sweep:
# against a reference set the size of SILVA the interesting failure is not "can it split
# two known strains" but "does it invent taxa that are not there". `presence: 0.6667`
# leaves a third of the panel genuinely absent in each sample, and every other genus in
# SILVA is absent from every sample - so a setting's false-positive behaviour is what
# this example measures.
sampling:
  n_samples: 20
  seed: 1
  presence: 0.6667              # Bernoulli p that each genome is present in a sample
  negative_binomial:
    mean: 20
    dispersion: 1.0

# One read-generation mode: V4 amplicons cut out of full-length 16S by in-silico PCR,
# profiled with superresolution-amplicon. (The sibling NB example also sweeps a `wgs`
# mode; this sweep is about the amplicon knobs, so there is nothing for it to do here.)
generation_modes:
  - name: amplicon_16s
    source: ssu
    mode: amplicon
    profilers: [sr_amplicon]
    primers:
      - {pair_id: 515-YF-806BR, forward: GTGYCAGCMGCCGCGGTAA, reverse: GGACTACNVGGGTWTCTAAT}

# The parameter grid, expanded into the samplesheet's `sr_settings:` list. Each axis is
# a list of named knob maps and the sweep is their cartesian product; a point's name
# (axis names joined with '.') becomes part of its output filename. Knob names are the
# pipeline's sr_settings keys:
#   matrix : mismapping_method, align_backend, align_tau, matrix_args
#   infer  : infer_presence, infer_presence_prior, infer_presence_temp, inference_args
#
# Every point infers in V4-group space (`--infer_space v4_group`, set once in
# benchmark.config as `sr_amplicon_inference_args`). A point that sets its own
# `inference_args` replaces that, so it must repeat the flag.
#
# Every `align_tau >= 1` point carries `align_distance_decay: 0.007`: without it a
# reference one edit away shares a row equally with an exact duplicate, which on the
# two-strain B. uniformis set is 2.5x worse than exact-hash on mean row L1. ~ the
# per-base error rate is the right order. No-op (and unset) at align_tau 0.
#
# `kmer1` and `kmer1_latent` differ only in `infer_distance_decay`: one takes the decay
# the matrix was built with, the other fits it per sample. Their matrix knobs are
# identical, so they share one matrix and the comparison costs one inference run. The
# latent needs `align_tau >= 1` (at tau 0 every distance is 0 and the decay cancels),
# which is why it rides on the kmer point rather than being an axis of its own.

# The matrix knobs are what cost: one mis-mapping matrix is built per DISTINCT
# COMBINATION OF THEM, over the WHOLE reference set - SILVA, here, not the 20 genomes in
# the panel. The inference knobs are free by comparison, which is why the presence prior
# is swept in the same run rather than in two.
#
# `mismapping_method: simulate` is deliberately absent: it simulates and maps
# `sim_n_per_ref` reads for every reference in the set, which is fine for a 20-genome
# collection and not fine for SILVA. Uncomment it only if you know the reference set is
# small - and expect it to dominate the run.
sr_sweep:
  grid:
    matrix:
      - {name: exact, mismapping_method: align, align_backend: exact-hash, align_tau: 0,
         matrix_args: --align_ambiguity_weight 0.3}
      - {name: kmer1, mismapping_method: align, align_backend: kmer, align_tau: 1,
         align_distance_decay: 0.007,
         matrix_args: --align_ambiguity_weight 0.3 --max_postings 4096}
      - {name: kmer1_latent, mismapping_method: align, align_backend: kmer, align_tau: 1,
         align_distance_decay: 0.007, infer_distance_decay: true,
         matrix_args: --align_ambiguity_weight 0.3 --max_postings 4096}
      - {name: kmer2, mismapping_method: align, align_backend: kmer, align_tau: 2,
         align_distance_decay: 0.007,
         matrix_args: --align_ambiguity_weight 0.3 --max_postings 4096}
      # - {name: simulate, mismapping_method: simulate}   # see the note above
    infer:
      - {name: p01, infer_presence: true, infer_presence_prior: 0.01, infer_presence_temp: 1.0}
      - {name: p001, infer_presence: true, infer_presence_prior: 0.001, infer_presence_temp: 1.0}
      # superresolution-amplicon recommends no gate at database scale in V4-group space:
      # with the gate on, 40% of its replayed samples failed the fit check, 2% without.
      - {name: nogate, infer_presence: false}

# The reference set under test. `path:` is a PRE-BUILT database directory, laid out the
# way the pipeline publishes its own (`<outdir>/databases/<name>/`):
#
#   <path>/<name>_ssu.sr_refs.fasta      headers `{accession}|0|{accession}`
#   <path>/<name>_ssu.sr_refs.tax        MAPseq taxonomy, one SILVA lineage per header
#
# Build both once, out of band, with superresolution-amplicon's
# `bin/build_mapseq_database.py --silva-fasta SILVA_138.2_SSURef_NR99_tax_silva.fasta.gz`
# and rename them to the pattern above. Nothing is built during the run. The `.tax` is
# what makes this example scoreable: every nested run gets it as `--taxonomy`, and it
# names each V4 group's `lca`.
#
# SILVA is a label space here, not a set of genomes: its accessions are single rRNA
# sequences, so the panel ids below are free and are never compared with them.
#
# To run the same sweep against a small collection the pipeline builds itself (a useful
# control - a matrix over 20 references costs nothing), delete `path:` and set
# `sequences_from_panel: true` instead. The panel's `taxonomy:` gives that collection a
# `.tax` too.
database:
  name: silva_138_2_ssu_nr99
  profilers: [sr_amplicon]
  path: /PATH/TO/silva_138_2_ssu_nr99   # dir holding silva_138_2_ssu_nr99_ssu.sr_refs.{fasta,tax}
  # sequences_from_panel: true          # build from `panel:` instead of using `path:`

# One entry per genome in the synthetic community. `ssu:` (full-length 16S) feeds the
# in-silico PCR that generates the reads. The references the reads are PROFILED against
# come from `database.path:`, not from here - which is exactly the thing under test.
#   id        : names the genome in truth.tsv
#   species   : used by the sibling examples' derived taxonomy; may repeat across ids
#   ssu       : full-length 16S FASTA the V4 amplicons are cut from
#   taxonomy  : its SILVA 138.2 lineage down to genus. scripts/score_sweep.py rolls
#               truth up to genus through it. These are the majority SILVA genus of the
#               sequences sharing each genome's V4 amplicon (superresolution-amplicon
#               dev/panel_silva_sweep.py), so SILVA's own renames apply: C. ramosum is
#               Thomasclavelia, E. rectale is Agathobacter.
panel:
  - id: bacteroides_fragilis
    species: bacteroides_fragilis
    ssu: references/16S/bacteroides_fragilis.ssu.fasta
    taxonomy: "Bacteria;Bacteroidota;Bacteroidia;Bacteroidales;Bacteroidaceae;Bacteroides"
  - id: bacteroides_thetaiotaomicron
    species: bacteroides_thetaiotaomicron
    ssu: references/16S/bacteroides_thetaiotaomicron.ssu.fasta
    taxonomy: "Bacteria;Bacteroidota;Bacteroidia;Bacteroidales;Bacteroidaceae;Bacteroides"
  - id: bacteroides_uniformis
    species: bacteroides_uniformis
    ssu: references/16S/bacteroides_uniformis.ssu.fasta
    taxonomy: "Bacteria;Bacteroidota;Bacteroidia;Bacteroidales;Bacteroidaceae;Bacteroides"
  - id: bacteroides_vulgatus
    species: bacteroides_vulgatus
    ssu: references/16S/bacteroides_vulgatus.ssu.fasta
    taxonomy: "Bacteria;Bacteroidota;Bacteroidia;Bacteroidales;Bacteroidaceae;Bacteroides"
  - id: clostridium_bolteae
    species: clostridium_bolteae
    ssu: references/16S/clostridium_bolteae.ssu.fasta
    taxonomy: "Bacteria;Bacillota;Clostridia;Lachnospirales;Lachnospiraceae;Enterocloster"
  - id: clostridium_perfringens
    species: clostridium_perfringens
    ssu: references/16S/clostridium_perfringens.ssu.fasta
    taxonomy: "Bacteria;Bacillota;Clostridia;Clostridiales;Clostridiaceae;Clostridium"
  - id: clostridium_ramosum
    species: clostridium_ramosum
    ssu: references/16S/clostridium_ramosum.ssu.fasta
    taxonomy: "Bacteria;Bacillota;Bacilli;Erysipelotrichales;Erysipelatoclostridiaceae;Thomasclavelia"
  - id: clostridium_saccharolyticum
    species: clostridium_saccharolyticum
    ssu: references/16S/clostridium_saccharolyticum.ssu.fasta
    taxonomy: "Bacteria;Bacillota;Clostridia;Lachnospirales;Lachnospiraceae;Lachnoclostridium"
  - id: collinsella_aerofaciens
    species: collinsella_aerofaciens
    ssu: references/16S/collinsella_aerofaciens.ssu.fasta
    taxonomy: "Bacteria;Actinomycetota;Coriobacteriia;Coriobacteriales;Coriobacteriaceae;Collinsella"
  - id: coprococcus_comes
    species: coprococcus_comes
    ssu: references/16S/coprococcus_comes.ssu.fasta
    taxonomy: "Bacteria;Bacillota;Clostridia;Lachnospirales;Lachnospiraceae;Coprococcus"
  - id: dorea_formicigenerans
    species: dorea_formicigenerans
    ssu: references/16S/dorea_formicigenerans.ssu.fasta
    taxonomy: "Bacteria;Bacillota;Clostridia;Lachnospirales;Lachnospiraceae;Dorea"
  - id: eggerthella_lenta
    species: eggerthella_lenta
    ssu: references/16S/eggerthella_lenta.ssu.fasta
    taxonomy: "Bacteria;Actinomycetota;Coriobacteriia;Coriobacteriales;Eggerthellaceae;Eggerthella"
  - id: eubacterium_rectale
    species: eubacterium_rectale
    ssu: references/16S/eubacterium_rectale.ssu.fasta
    taxonomy: "Bacteria;Bacillota;Clostridia;Lachnospirales;Lachnospiraceae;Agathobacter"
  - id: fusobacterium_nucleatum
    species: fusobacterium_nucleatum
    ssu: references/16S/fusobacterium_nucleatum.ssu.fasta
    taxonomy: "Bacteria;Fusobacteriota;Fusobacteriia;Fusobacteriales;Fusobacteriaceae;Fusobacterium"
  - id: methanobrevibacter_smithii
    species: methanobrevibacter_smithii
    ssu: references/16S/methanobrevibacter_smithii.ssu.fasta
    kingdom: archaea
    taxonomy: "Archaea;Methanobacteriota;Methanobacteria;Methanobacteriales;Methanobacteriaceae;Methanobrevibacter"
  - id: parabacteroides_merdae
    species: parabacteroides_merdae
    ssu: references/16S/parabacteroides_merdae.ssu.fasta
    taxonomy: "Bacteria;Bacteroidota;Bacteroidia;Bacteroidales;Tannerellaceae;Parabacteroides"
  - id: roseburia_intestinalis
    species: roseburia_intestinalis
    ssu: references/16S/roseburia_intestinalis.ssu.fasta
    taxonomy: "Bacteria;Bacillota;Clostridia;Lachnospirales;Lachnospiraceae;Roseburia"
  - id: ruminococcus_gnavus
    species: ruminococcus_gnavus
    ssu: references/16S/ruminococcus_gnavus.ssu.fasta
    taxonomy: "Bacteria;Bacillota;Clostridia;Lachnospirales;Lachnospiraceae;[Ruminococcus] gnavus group"
  - id: streptococcus_parasanguinis
    species: streptococcus_parasanguinis
    ssu: references/16S/streptococcus_parasanguinis.ssu.fasta
    taxonomy: "Bacteria;Bacillota;Bacilli;Lactobacillales;Streptococcaceae;Streptococcus"
  - id: streptococcus_salivarius
    species: streptococcus_salivarius
    ssu: references/16S/streptococcus_salivarius.ssu.fasta
    taxonomy: "Bacteria;Bacillota;Bacilli;Lactobacillales;Streptococcaceae;Streptococcus"
