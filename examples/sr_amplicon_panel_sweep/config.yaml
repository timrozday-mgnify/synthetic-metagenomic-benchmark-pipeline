# Config for the SILVA panel-reinterpretation vs custom-database sweep. This one file is
# the single source of truth for every script here; no paths or metadata are hard-coded
# in Python. Relative paths resolve against this file's dir.
#
# The question: the reads were mapped against SILVA, and the community is known to come
# from a panel (the 20HM mock plus a second B. uniformis strain). How close does
# reinterpreting the SILVA labels through that panel get to mapping against a custom
# database of the panel itself, and under which kernel and prior?
#
# Fill in the two train FASTQs, the panel's `ssu:` paths and `generic.path:`. Also set
# `sr_amplicon_repo` in benchmark.config. Then run ./run.sh.

train:
  id: sc2200627
  # Real reads the sequencing-error model is trained from (once, shared by all samples).
  fastq_1: /PATH/TO/SC2200627_R1.fastq.gz
  fastq_2: /PATH/TO/SC2200627_R2.fastq.gz
  platform: hq-illumina        # 2x300 MiSeq amplicon tails may fit 'lq-illumina' better

reads:
  num_reads: 1000000           # 500k pairs x 2 (pipeline counts paired reads as pairs*2)
  subsample: [none, 100000]    # one benchmark dir per depth; `none` = full depth
  # The nested run maps at most `obs_max_reads` fragments per sample (100,000
  # upstream), so every depth at or above 200,000 reads (100,000 pairs) infers from
  # the same 100,000 fragments. A `200000` point next to `none` is two draws of one
  # depth, not two depths -- the HPC panel run did exactly that. Keep depths below it.
  paired_end: true
  read_length_mean: 300
  read_length_variance: 0

# Community model, identical to examples/abundance_nb_sample: each panel genome is drawn
# INDEPENDENTLY per sample. Bernoulli(presence) decides whether it is there at all, and if
# so NegBinom(mean, dispersion) sets its abundance. Seeded, so a rerun reproduces the same
# 20 communities. A genome may override `presence:` and/or `nb: {mean?, dispersion?}` inline.
#
# About a third of the panel is absent from each sample. A reinterpretation that invents
# them, or pushes their mass into `background`, shows up as `mass_absent` in the scores.
# The B. uniformis pair is present together in only some samples, and those samples give
# `strain_split_error`.
sampling:
  n_samples: 20
  seed: 1
  presence: 0.6667
  negative_binomial:
    mean: 20
    dispersion: 1.0

# One read-generation mode: V4 amplicons cut out of full-length 16S by in-silico PCR.
# superresolution-amplicon cuts both reference sets' amplicons, and the panel's, with the
# same pair.
generation_modes:
  - name: amplicon_16s
    source: ssu
    mode: amplicon
    profilers: [sr_amplicon]
    primers:
      - {pair_id: 515-YF-806BR, forward: GTGYCAGCMGCCGCGGTAA, reverse: GGACTACNVGGGTWTCTAAT}

# The CUSTOM database, built in-pipeline from `panel:` below. It has two jobs:
#   - the `custom` arm maps the reads against it;
#   - the `generic_panel` arm reinterprets the SILVA labels through it (every generic_panel
#     setting gets `panel: <this name>`).
# The generic_taxa arm's panel is a second collection, `<this name>_taxa`, made from the
# strain pair's `ssu:` and every other genome's `silva_taxon:`.
# Since both arms see the same panel ids, their profiles and truth.tsv line up with no
# id translation.
database:
  name: community_20hm
  profilers: [sr_amplicon]

# The GENERIC database the generic_panel arm maps against: a PRE-BUILT directory holding
# `<name>_ssu.sr_refs.fasta` (headers `{accession}|0|{accession}`) and, optionally, its
# `<name>_ssu.sr_refs.tax`, laid out the way the pipeline publishes its own databases.
# Build both with superresolution-amplicon's `build_mapseq_database.py --silva-fasta`
# (SILVA Ref NR99) and rename them. The panel ids are free, because inference runs over
# the panel: SILVA is only the label space the reads are mapped into.
generic:
  name: silva_138_2_ssu_nr99
  path: /PATH/TO/silva_138_2_ssu_nr99          # dir holding silva_138_2_ssu_nr99_ssu.sr_refs.{fasta,tax}
  # Phase 1 maps every benchmark dir against SILVA once, under this one setting, so that
  # phase 2 can hand the classification back as `mseq:`. Its composition is a by-product
  # and is not scored. exact-hash is the matrix mode that is cheap at SILVA scale.
  map_setting: {name: map, mismapping_method: align, align_backend: exact-hash, align_tau: 0,
                matrix_args: --align_ambiguity_weight 0.3}

# The parameter grids, one per arm. Each is the same shape as
# examples/sr_amplicon_param_sweep's `sr_sweep.grid`: every axis is a list of named knob
# maps, and the grid is their cartesian product. A point is named `<arm>.<axis names
# joined by '.'>`, and that name becomes part of its output filename. Knobs are the
# pipeline's sr_settings keys:
#   matrix : mismapping_method, align_backend, align_tau, align_distance_decay,
#            align_decay_model, matrix_args, panel
#   infer  : infer_presence, infer_presence_prior, infer_presence_temp,
#            infer_distance_decay, infer_decay_sigma, inference_args
# Any other superresolution-amplicon param goes through `matrix_args` or
# `inference_args`, e.g. `--sim_error_model trained`, `--infer_horseshoe true` or
# `--infer_steps 10000`. When two axes of one point both set `matrix_args` or
# `inference_args`, the flags are joined, not overwritten.
sr_sweep:
  # Mapping against the panel itself. Grid points agreeing on every matrix knob share one
  # matrix: this 2x2 grid is 4 profiles per dir off 2 matrices.
  custom:
    grid:
      matrix:
        # Flat error is enough for a 23-reference set (superresolution-amplicon dev/error_rate_sensitivity.md).
        - {name: simulate, mismapping_method: simulate}
        - {name: kmer1_latent, mismapping_method: align, align_backend: kmer, align_tau: 1,
           align_distance_decay: 0.007, infer_distance_decay: true,
           matrix_args: --align_ambiguity_weight 0.3 --max_postings 4096}
      prior:
        - {name: gate, infer_presence: true, infer_presence_prior: 0.01, infer_presence_temp: 1.0}
        - {name: nogate, infer_presence: false}

  # SILVA labels, reinterpreted through the panel. The kernel is measured by simulating
  # reads from the panel's V4 amplicons and mapping them against SILVA. The nested run does
  # that INSIDE each inference run, so unlike the custom arm, every point here pays for
  # its own kernel: panel_sim_n_per_ref (default 5,000) reads per distinct amplicon
  # (about 30 here), each mapped against SILVA. The reads themselves are not re-mapped.
  #
  # `panel:` is added to every point by the generator. infer_distance_decay is refused
  # here, because a panel kernel records no distances.
  generic_panel:
    grid:
      kernel:
        # `trained` simulates with the skiver model phase 1 generated the reads with
        # (handed over as `sr_error_model:`). That is an oracle, so it is optimistic.
        - {name: trained, mismapping_method: simulate, matrix_args: --sim_error_model trained}
        # `flat` uses no trained model, so it is the honest number when there is none.
        - {name: flat, mismapping_method: simulate, matrix_args: --sim_error_model flat}
      prior:
        - {name: gate, infer_presence: true, infer_presence_prior: 0.01, infer_presence_temp: 1.0}
        - {name: nogate, infer_presence: false}
        - {name: horseshoe, infer_presence: false, inference_args: --infer_horseshoe true}
      steps:
        - {name: s3k, inference_args: --infer_steps 3000}
        # The gate collapses at 10k steps on this panel (superresolution-amplicon dev/panel_reinterpretation.md);
        # uncomment to see it. Doubles the generic_panel cost.
        # - {name: s10k, inference_args: --infer_steps 10000}

  # SILVA labels, reinterpreted through a panel of TAXA: the strain pair stays as genomes,
  # and every other genome is its SILVA species (`panel[].silva_taxon`), so an entry's
  # sources are all SILVA V4 groups of that species, each fitted freely. It asks how much
  # knowing only the species costs against knowing the genome (generic_panel). Species is
  # the only rank tested: a genus is hundreds of V4 groups and inference collapses
  # (superresolution-amplicon dev/panel_silva_sweep.md). A species is 1-24 groups there, so
  # a kernel here simulates about 90 sources instead of about 30.
  #
  # Entry ids are the genome ids, so it is scored like the other arms. The generator adds
  # `panel:` (the `<database.name>_taxa` collection). No gate: it misfit on half the
  # samples in the SILVA sweep.
  generic_taxa:
    grid:
      kernel:
        - {name: trained, mismapping_method: simulate, matrix_args: --sim_error_model trained}
        - {name: flat, mismapping_method: simulate, matrix_args: --sim_error_model flat}
      prior:
        - {name: nogate, infer_presence: false}
        - {name: horseshoe, infer_presence: false, inference_args: --infer_horseshoe true}

# Scoring (scripts/score_sweep.py): the strain pair whose split `strain_split_error`
# reports, as [major, minor].
score:
  strain_pair: [bacteroides_uniformis, bacteroides_uniformis_strain2]

# One entry per genome: the 20HM mock community plus a second B. uniformis strain. `ssu:`
# (full-length 16S) feeds read generation, the custom database and the reinterpretation
# panel alike. `silva_taxon:` is the genome's SILVA species (a full lineage, as
# build_mapseq_database.py --silva-fasta writes it): the generic_taxa arm's entry for that
# genome. Every genome outside `score.strain_pair` needs one. The file names are the ones the sr_amp_param_sweep run used.
panel:
  - {id: bacteroides_fragilis,          ssu: references/16S/CR626927.1_SSU.fasta,
     silva_taxon: "Bacteria;Bacteroidota;Bacteroidia;Bacteroidales;Bacteroidaceae;Bacteroides;Bacteroides fragilis"}
  - {id: bacteroides_thetaiotaomicron,  ssu: references/16S/CP040530.1_SSU.fasta,
     silva_taxon: "Bacteria;Bacteroidota;Bacteroidia;Bacteroidales;Bacteroidaceae;Bacteroides;Bacteroides thetaiotaomicron"}
  - {id: bacteroides_uniformis,         ssu: references/16S/FNPN01_SSU.fasta}
  - {id: bacteroides_uniformis_strain2, ssu: references/16S/BU_JCM13286_NT5170.1_SSU.fasta}
