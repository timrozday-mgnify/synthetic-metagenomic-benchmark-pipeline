# Phase 4 truth sample (docs/aap_silva_compat_plan.md): one synthetic V4 community from
# the 20HM panel, profiled by AAP and by superresolution-amplicon five ways.
#
#   arm 1  aap          AAP's own SILVA labels (the aap profiler; scored at species level)
#   arm 2  sim_merged   AAP's merged reads + .mseq, kernel simulated as merged reads
#   arm 3  sim_pairs    same, kernel simulated as mate pairs run through AAP's fastp merge
#   arm 4  align        same, align kernel (tau 1) with separate substitution/indel decays
#   arm 5  raw          the raw pairs, SR's own merge and primer trim, same SILVA database
#
# Paths under results/ are written by run.sh's first (train) step. Relative paths resolve
# against the pipeline directory.
databases:
  # AAP's SILVA-SSU directory, unmodified. Both profilers map against it, so AAP's .mseq
  # is valid for SR as supplied.
  silva_aap:
    path: /Users/timrozday/Downloads/silva-ssu-138.1/138.1
    rfam_covariance_model: /Users/timrozday/Documents/Pipelines/assembly-analysis-pipeline/tests/reference_databases/rfam   # a DIRECTORY of *.cm (AAP globs it)
    rfam_claninfo: /Users/timrozday/Documents/Pipelines/assembly-analysis-pipeline/tests/reference_databases/rfam/ribo.clan_info
  # The panel every SR arm reinterprets the SILVA labels through: all 22 genomes,
  # including the 6 absent from the sample.
  community_20hm:
    sequences:
      - {id: bacteroides_fragilis, ssu: /Users/timrozday/Documents/synthetic-metagenomic-benchmark-pipeline_runs/sr_amp_panel_sweep/export/references/16S/CR626927.1_SSU.fasta}
