samples:
  - sample: T1
    train_id: sc2200627
    # A raw fermentor run (2x310, Finn). No raw Nov2025 FASTQs were at hand.
    train_fastq_1: /Users/timrozday/Downloads/SC2200627-SC3/SC2200627-SC3_Batch_54_samples_26s000943-1-1_Finn_lane1C1_1_sequence.fq.gz
    train_fastq_2: /Users/timrozday/Downloads/SC2200627-SC3/SC2200627-SC3_Batch_54_samples_26s000943-1-1_Finn_lane1C1_2_sequence.fq.gz
    platform: hq-illumina
    # Generate from the model run.sh's train step published, not a second training.
    error_model_dir: results/sr_amplicon_aap/error_models/sc2200627
    # The same model, handed to the pairs arm: it is a per-mate model trained on raw
    # R1/R2, which is what --sim_read_structure pairs needs. An oracle, so optimistic.
    sr_error_model: results/sr_amplicon_aap/error_models/sc2200627/sc2200627.model.pt
    genomes_csv: examples/sr_amplicon_aap/genomes.csv
    num_reads: 400000            # 200k pairs
    mode: amplicon
    paired_end: true
    read_length_mean: 310
    read_length_variance: 0
    primers:
      - {pair_id: 515-YF-806BR, forward: GTGYCAGCMGCCGCGGTAA, reverse: GGACTACNVGGGTWTCTAAT}
    profilers: [aap, sr_amplicon]
    database: silva_aap
    sr_settings:
      # 0.2's measured merged-read rates (sub 3.4e-4, indels 4e-6).
      - {name: sim_merged, aap_reads: true, panel: community_20hm, mismapping_method: simulate,
         matrix_args: --flat_sub_rate 0.00034 --flat_ins_rate 0.000004 --flat_del_rate 0.000004}
      - {name: sim_pairs, aap_reads: true, panel: community_20hm, mismapping_method: simulate,
         matrix_args: --sim_read_structure pairs --sim_mate_len 310 --sim_error_model trained}
      # auto measures both decays off the same flat merged-read rates.
      - {name: align, aap_reads: true, panel: community_20hm, mismapping_method: align,
         align_tau: 1, align_distance_decay: auto,
         matrix_args: --align_indel_decay auto --flat_sub_rate 0.00034 --flat_ins_rate 0.000004 --flat_del_rate 0.000004}
      # SC2200627's calibrated raw substitution rate (superresolution-amplicon dev/error_rate_calibration.md).
      - {name: raw, panel: community_20hm, mismapping_method: simulate,
         matrix_args: --flat_sub_rate 0.0031}
